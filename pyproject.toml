[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "port-hud"
version = "0.1.0"
description = "Inspect and kill listening local TCP ports via CLI or a cyberpunk floating HUD"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "port-hud contributors" }]
keywords = ["ports", "lsof", "cli", "hud", "tkinter", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
port-hud = "port_hud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/port_hud"]
